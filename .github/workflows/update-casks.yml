name: Update casks

# Bumps each cask to its app's latest GitHub release.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update NotchBar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo rikenpatel02/notchbar --json tagName --jq .tagName)
          VERSION="${TAG#v}"
          CURRENT=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/notchbar.rb)
          if [[ "$VERSION" == "$CURRENT" ]]; then
            echo "NotchBar is up to date ($VERSION)"
            exit 0
          fi
          SHA=$(curl -fsSL "https://github.com/rikenpatel02/notchbar/releases/download/$TAG/NotchBar-$VERSION.dmg.sha256" | awk '{print $1}')
          [[ ${#SHA} -eq 64 ]] || { echo "::error::No checksum for $TAG"; exit 1; }
          sed -i -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/notchbar.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "notchbar $VERSION"
          git push
